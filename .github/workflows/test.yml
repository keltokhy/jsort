name: test
on: [push, pull_request]
defaults:
  run:
    working-directory: consumer
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: consumer
      - uses: actions/checkout@v4
        with:
          repository: keltokhy/jevkit-core
          ref: v0.1.0
          path: jevkit-core
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q
