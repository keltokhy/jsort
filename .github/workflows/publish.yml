name: Test and publish
# Every push and pull request runs the tests. A pushed tag like v0.1.0 also publishes to PyPI once the
# tests pass. PyPI trusts this workflow file by name (Trusted Publishing), so there is no API token to
# store, leak or rotate; keep the filename.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, so a dependency release shows up even in a week with no pushes

permissions:
  contents: read

defaults:
  run:
    working-directory: consumer

jobs:
  test:
    name: test (${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # locked installs what uv.lock pins. lowest and latest ignore the lockfile and install the oldest and
    # newest versions pyproject.toml allows, as `pip install` may, so a dependency range that has stopped
    # being true fails here instead of for users (pandas 3 broke jlink 0.5.0).
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", deps: locked, sync: --locked}
          - {python: "3.13", deps: locked, sync: --locked}
          - {python: "3.10", deps: lowest, sync: --upgrade --resolution lowest-direct}
          - {python: "3.14", deps: latest, sync: --upgrade}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keltokhy/jevkit-core
          ref: v0.4.2
          path: jevkit-core
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
      - run: uv sync ${{ matrix.sync }}
      - run: uv run pytest -q
      - run: uv build --no-sources
      - run: uvx --from twine==7.0.0 twine check --strict dist/*

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jev-sort/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          python-version: "3.13"
      - name: Verify the release tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build --no-sources
      - run: uv publish --trusted-publishing always
