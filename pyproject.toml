[project]
name = "jev-sort"
version = "0.5.0"
description = "sort by meaning: order lines along a plain-English dimension, from pairwise comparisons judged by TypeSafe's Jev model"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = [
    "jevkit-runtime>=0.4.0,<0.5.0",
    "httpx>=0.27",
    "numpy>=1.24",
]
keywords = ["sort", "rank", "cli", "pairwise comparison", "bradley-terry", "jev", "typesafe", "openrouter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/keltokhy/jsort"

[project.scripts]
jsort = "jsort.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]
bench = ["openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsort"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
jevkit-runtime = { path = "../jevkit-core", editable = true }
